# Ixtiyoriy: domen va HTTPS orqali (80/443 port) ishlatmoqchi bo'lsangiz.
# 8090-portga to'g'ridan-to'g'ri ulanadigan bo'lsangiz, bu fayl shart emas.
#
# O'rnatish:
#   sudo cp deploy/nginx/bekzodbro.conf /etc/nginx/sites-available/bekzodbro
#   sudo nano /etc/nginx/sites-available/bekzodbro   # your-domain.com ni almashtiring
#   sudo ln -s /etc/nginx/sites-available/bekzodbro /etc/nginx/sites-enabled/
#   sudo nginx -t 
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name 31.220.77.65;

    location /static/ {
        alias /opt/bekzodbro/staticfiles/;
    }

    location /media/ {
        alias /opt/bekzodbro/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
